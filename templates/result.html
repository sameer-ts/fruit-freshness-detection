<!DOCTYPE html>
<html>
<head>
    <title>Detection Result</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f7f2;
            text-align: center;
            padding: 60px;
        }

        .result {
            background: white;
            max-width: 600px;
            margin: auto;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        h1 {
            color: #2e7d32;
        }

        .prediction {
            font-size: 28px;
            font-weight: bold;
            margin: 25px;
        }

        .confidence {
            font-size: 20px;
        }

        a {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 25px;
            background: #2e7d32;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }
    </style>
</head>

<body>

<div class="result">

    <h1>🍓 Detection Result</h1>

    <div class="prediction">
        {{ result }}
    </div>

    <div class="confidence">
        Confidence: {{ confidence }}%
    </div>

    <a href="/">
        Check Another Fruit
    </a>

</div>

</body>
</html>
